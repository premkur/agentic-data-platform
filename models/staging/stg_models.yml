version: 2
models:
  - name: stg_customers
    description: One row per customer with normalised country_code. Contains PII (email, full_name).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [not_null]
  - name: stg_products
    description: One row per product.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_orders
    description: One row per order (latest version only).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'delivered', 'cancelled', 'returned']
  - name: stg_order_items
    description: One row per order line.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
  - name: stg_payments
    description: One row per payment attempt or refund. Amounts are positive; see status.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['captured', 'failed', 'refunded']
